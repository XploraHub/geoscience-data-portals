caveats:
  - Contractor packages in the airborne magnetic and radiometric releases are Geosoft databases and grids, which need Oasis montaj or the free Geosoft Viewer; some releases add CSV, GeoTIFF and shapefiles.
  - Airborne electromagnetic releases (for example the Basin and Range survey) deliver flight-line data and inversions as netCDF.
  - Superseded versions stay online; the 2019 Illinois-Kentucky-Indiana survey points to version 2.0 at https://doi.org/10.5066/P14PJFWS.
  - The project page at https://mrdata.usgs.gov/earthmri/data-acquisition/ is marked "Currently under revision", and its Earth MRI Acquisitions Viewer (https://ngmdb.usgs.gov/emri/) refused automated access when checked.
  - The WFS for Earth MRI geochemistry (https://mrdata.usgs.gov/services/wfs/earthmrichem) returned a MapServer error when tested.
